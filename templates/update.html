{% extends "base.html" %}

{% block head %}
  <title>Task Master</title>
{% endblock %}

{% block body %}
    <div class="content">
        <h1 style = "text-align: center">Welcome to the Task Master App!</h1>

        <form action="/update/{{task.id}}" method="POST">
            <input type="text" name="content" value="{{task.content}}" id="content" required>
            <button type="submit">Update Task</button>
        </form>
    </div>
{% endblock %}
